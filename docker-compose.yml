# Runs the whole app locally:   docker compose up --build
#   frontend → http://localhost:8080
#   API      → http://localhost:3000
#
# Needs server/.env (see README.md). It points at the shared Supabase database,
# so this is the same data as everyone else — not a throwaway copy.
services:
  api:
    build: ./server
    env_file: ./server/.env
    ports:
      - "3000:3000"
    volumes:
      # Local-disk uploads, used only when SUPABASE_URL/KEY are not set.
      - uploads:/app/uploads
      - private-uploads:/app/private-uploads
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        # The browser calls the API, not the web container, so this is the
        # address as seen from the host machine.
        VITE_API_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  uploads:
  private-uploads:
