# Mirrors vercel.json so the container behaves like the Vercel deploy.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker must never be cached, or a deploy never reaches
    # devices that already have the app installed.
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Client-side routes (/teacher/..., /student/...) all resolve to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
