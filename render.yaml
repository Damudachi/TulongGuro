services:
  - type: web
    name: tulongguro-api
    runtime: node
    buildCommand: cd server && npm install && npx prisma generate && npx prisma db push
    startCommand: cd server && node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Signs login sessions. The server refuses to start without it in
      # production rather than fall back to a guessable key, so a missing value
      # here is a failed deploy, not a silently insecure one.
      - key: AUTH_SECRET
        sync: false
      # Unlocks /platform/approvals. Must be a different value from AUTH_SECRET.
      - key: PLATFORM_ADMIN_KEY
        sync: false
      - key: NODE_ENV
        value: production
