services:
  - type: web
    name: tulongguro-api
    runtime: node
    # `npm run verify` runs the grading-math, dashboard and route-authorization
    # checks. Placed before `db push` on purpose: a failure stops the deploy
    # without having touched the database. All three scripts are pure — no
    # Prisma client, no DB, no network — so they can only fail on a real
    # regression, never on a missing env var or an unreachable service.
    buildCommand: cd server && npm install && npm run verify && npx prisma generate && npx prisma db push
    startCommand: cd server && node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Signs login sessions. The server refuses to start without it in
      # production rather than fall back to a guessable key, so a missing value
      # here is a failed deploy, not a silently insecure one.
      - key: AUTH_SECRET
        sync: false
      # Unlocks /platform/approvals. Must be a different value from AUTH_SECRET.
      - key: PLATFORM_ADMIN_KEY
        sync: false
      - key: NODE_ENV
        value: production
