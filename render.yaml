services:
  - type: web
    name: tulongguro-api
    runtime: node
    # ── Single instance is load-bearing, not incidental ──
    # Three pieces of server state live in process memory and have no shared
    # store behind them:
    #   • the AI-check job registry (aiJobs) — a job started on one instance is
    #     invisible to any other, so a poll that lands elsewhere 404s while the
    #     run is still burning quota;
    #   • the login/password rate-limit buckets — the effective limit
    #     multiplies by the instance count;
    #   • the per-model daily AI quota counters (gradingPool[].used) — each
    #     instance would believe it has the whole daily budget to itself and
    #     spend its way into 429s.
    # Raising this needs those three moved to a shared store first. The server
    # logs a warning at boot restating this; see the aiJobs comment in
    # server.js for the detail.
    numInstances: 1
    # `npm run verify` runs the grading-math, dashboard and route-authorization
    # checks, plus the unit suite. Placed before the migration on purpose: a
    # failure stops the deploy without having touched the database.
    #
    # `migrate deploy`, not `db push`. db push diffs the live schema against
    # schema.prisma and reshapes the database to match, with no record of what
    # it did and no way back — on a database holding a term's marked work, a
    # column rename it decides to implement as drop-and-add is unrecoverable.
    # migrate deploy applies the reviewed SQL in prisma/migrations in order and
    # refuses to run anything it does not recognise, so a drift between what
    # was tested and what is live fails the deploy instead of silently
    # rewriting production.
    buildCommand: cd server && npm install && npm run verify && npx prisma generate && npx prisma migrate deploy
    startCommand: cd server && node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      # Gemini credentials. More than one is supported because the daily quota
      # is metered per Google Cloud PROJECT per model, not per key — so eight
      # keys cut from eight different projects are eight independent budgets,
      # while eight keys cut from one project share a single budget and buy
      # nothing at all. Google AI Studio caps keys per project, so hitting that
      # cap is a sign of the second arrangement, not the first: check that the
      # keys come from different projects before assuming the ceiling moved.
      #
      # The server reads GEMINI_API_KEY, GOOGLE_API_KEY and GEMINI_API_KEY1..9,
      # skipping any that are unset — this list is an upper bound, not a
      # requirement, and starting at 1 with no unnumbered GEMINI_API_KEY is
      # normal. (The unnumbered one and GOOGLE_API_KEY are still read if this
      # deployment ever sets them; they are left out here so a Blueprint sync
      # does not ask for values that do not exist.) Names must match EXACTLY —
      # GEMINI_API_KEY_1 or GEMINI_KEY1 are invisible to the loader and fail
      # silently as "fewer buckets than expected". Check the 🤖 line in the
      # boot log for the count actually loaded.
      #
      # Declared here rather than left as dashboard-only values so a Blueprint
      # sync cannot drop the ones that are set: a wiped GEMINI_API_KEY5 does
      # not fail the deploy, it just quietly costs a share of the daily budget.
      - key: GEMINI_API_KEY1
        sync: false
      - key: GEMINI_API_KEY2
        sync: false
      - key: GEMINI_API_KEY3
        sync: false
      - key: GEMINI_API_KEY4
        sync: false
      - key: GEMINI_API_KEY5
        sync: false
      - key: GEMINI_API_KEY6
        sync: false
      - key: GEMINI_API_KEY7
        sync: false
      - key: GEMINI_API_KEY8
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Signs login sessions. The server refuses to start without it in
      # production rather than fall back to a guessable key, so a missing value
      # here is a failed deploy, not a silently insecure one.
      - key: AUTH_SECRET
        sync: false
      # Unlocks /platform/approvals. Must be a different value from AUTH_SECRET.
      - key: PLATFORM_ADMIN_KEY
        sync: false
      # Unlocks /dev/ai-metrics. Must be a different value from AUTH_SECRET
      # and PLATFORM_ADMIN_KEY — it is a separate audience with no overlap.
      - key: DEV_ACCESS_KEY
        sync: false
      - key: NODE_ENV
        value: production
