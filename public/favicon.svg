<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TulongGuro">
  <!-- A reduction of the full mark, not the mark itself: at the 16px a browser
       tab actually renders, four outlined faces collapse into noise. What
       survives the shrink is the graded sheet, so that is all this draws. The
       royal plate is the theme colour from index.html, and it is what keeps the
       icon visible against a light tab strip — the cream used for the launcher
       icons would sink into it.

       Stroke weights are tuned for the shrink, not for this 64px view: any
       heavier and the A's counter fills in below about 24px. -->
  <rect width="64" height="64" rx="14" fill="#2B59C3"/>
  <rect x="13" y="10" width="38" height="44" rx="6" fill="#FFFFFF"/>
  <g stroke="#C2C5E0" stroke-width="3" stroke-linecap="round">
    <path d="M20 21h20"/>
    <path d="M20 28h15"/>
  </g>
  <g stroke="#F5343A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M21.5 47l6-13 6 13"/>
    <path d="M24.1 41.6h6.8"/>
    <path d="M38.5 39h8M42.5 35v8" stroke-width="3.2"/>
  </g>
</svg>
