<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The full mark rather than a legible-at-16px reduction of it, by choice.
         .ico carries 16/24/32/48 so the browser picks per display density
         instead of downsampling one bitmap badly; it is also what Windows reads
         for the taskbar and pinned-site entries. The 96px PNG covers bookmark
         and new-tab tiles, which render far larger than the tab strip. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         numbers on a notched phone; without it the bottom dock's existing
         safe-area padding (index.css) silently evaluates to zero and the dock
         sits under the home indicator once installed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2B59C3" />
    <meta name="description" content="TulongGuro — AI-assisted grading and learning for Philippine schools." />

    <!-- Installable to the home screen. Android reads the manifest; iOS still
         wants its own apple-touch-icon and standalone hints, so both are here. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TulongGuro" />

    <!-- Rounded display/body faces. Schools on weak connections fall back to
         the system rounded stack declared in tailwind.config.js, so the app
         stays legible offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>TulongGuro</title>

    <!-- ── Theme, before the first paint ──
         React mounts a moment after the document does. Without this, a user who
         has chosen dark gets one frame of the light theme on every single load —
         a white flash, which on a phone at night is the most unpleasant thing a
         dark mode can do and the reason people stop using one.

         Deliberately inline and deliberately tiny: it has to run before the
         stylesheet paints, so it cannot be an imported module. It only sets the
         attribute the CSS keys off; utils/theme.js owns everything else and
         reads the same localStorage key. Wrapped in try/catch because storage
         is blocked in some embedded WebViews, and a theme preference must never
         be able to stop the app loading. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tg-theme');
          var pref = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
          var dark = pref === 'dark' || (pref === 'system' &&
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (dark) {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0B1120');
          }
        } catch (e) { /* leaves the light default, which is a working app */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
